[package]
name = "telemetry-fusion-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = { version = "0.27", features = ["glow"] }  # glow is needed on web
egui = "0.27"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI + utils
clap = { version = "4", features = ["derive"] }
# rand (REMOVED from global deps)

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[[bin]]
name = "simulator"
path = "src/bin/simulator.rs"

# Native-only dependencies (desktop builds)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.2", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"                    
web-time = "0.2"   # ← add this


